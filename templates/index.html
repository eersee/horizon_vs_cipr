<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Горизонт-ВС | Интерактивная презентация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="settings-icon" id="settingsToggle">⚙️</div>
        <div class="settings-panel" id="settingsPanel">
            <h3>Настройки показа</h3>
            <label>Интервал между слайдами (сек)</label>
            <input type="range" id="intervalSlider" min="1" max="10" step="0.5" value="3">
            <span id="intervalValue">3.0</span> сек
        </div>

        <!-- Главный слайд (слайд №1) – без надписи "Слайд 1" -->
        <div class="main-slide" id="mainSlide">
            <div class="slide-title" id="mainSlideTitle">Экосистема «Горизонт-ВС»</div>
            <div class="slide-content" id="mainSlideContent"></div>
        </div>

        <!-- Плитки разделов -->
        <div class="tiles-grid">
            {% for name in tile_names %}
            <div class="tile" data-section-name="{{ name }}">{{ name }}</div>
            {% endfor %}
        </div>
    </div>

    <div id="carouselModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close">&times;</span>
                <span id="slideCounter"></span>
            </div>
            <div id="carouselSlideTitle" class="slide-title"></div>
            <div id="carouselSlideContent" class="slide-content"></div>
            <div class="carousel-controls">
                <button id="prevSlideBtn">◀ Предыдущий</button>
                <button id="playPauseBtn">⏸ Пауза</button>
                <button id="nextSlideBtn">Следующий ▶</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        window.tileNames = {{ tile_names|tojson }};
        window.sectionsData = {{ sections|tojson }};
    </script>
</body>
</html>
